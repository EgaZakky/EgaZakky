name: GitHub contribution graph snake animation

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Draw contribution graph snake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: EgaZakky
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            output/github-contribution-grid-snake.svg

      - name: Commit and push snake to output branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout -b output || git checkout output
          git add output/github-contribution-grid-snake.svg
          git commit -m "chore: update snake animation [skip ci]" || true
          git push -u origin output || true
