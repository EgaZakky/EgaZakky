<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4655" />
      <stop offset="25%" stop-color="#FF6BD6" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="75%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#F5C518" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="#0F1923" />

  <!-- Diagonal splash lines -->
  <line x1="-200" y1="300" x2="400" y2="-200" stroke="url(#splashGrad)" stroke-width="12" opacity="0.9" />
  <line x1="1400" y1="300" x2="800" y2="-200" stroke="url(#splashGrad)" stroke-width="12" opacity="0.7" />
  <line x1="-100" y1="150" x2="1300" y2="150" stroke="#FF4655" stroke-width="2" opacity="0.35" />

  <!-- Corner accents -->
  <path d="M 60 60 L 180 60 L 60 180" fill="none" stroke="#00E5FF" stroke-width="4" />
  <path d="M 1020 60 L 1140 60 L 1020 180" fill="none" stroke="#A855F7" stroke-width="4" />
  <path d="M 60 120 L 180 120 L 60 240" fill="none" stroke="#F5C518" stroke-width="4" />
  <path d="M 1020 120 L 1140 120 L 1020 240" fill="none" stroke="#FF4655" stroke-width="4" />

  <!-- Main title -->
  <text x="600" y="150" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#ECE8E1" text-anchor="middle" letter-spacing="4">EgaZakky</text>
  <text x="600" y="195" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#00E5FF" text-anchor="middle" letter-spacing="2">Fullstack Developer // Valorant-Inspired Loadout</text>

  <!-- Decorative dots -->
  <circle cx="300" cy="100" r="6" fill="#FF4655" />
  <circle cx="320" cy="100" r="4" fill="#00E5FF" />
  <circle cx="900" cy="200" r="6" fill="#A855F7" />
  <circle cx="920" cy="200" r="4" fill="#F5C518" />
</svg>